      <h2>Notes</h2>
      <ol>
        <li>Production is dry rubber content in thousand tonnes. Smallholdings are holdings under 40.47 ha (100 acres), including RISDA, FELDA and FELCRA land schemes.</li>
        <li>Planted area is spliced from three series: DOSM (2005–2009), Malaysia’s UNFCCC reports BUR3 and BUR4 (2010–2017), and KPK (2018–2023). Figures for 2019–2023 are preliminary.</li>
        <li>Prices are monthly mean SMR 20 FOB prices in 2025 ringgit, deflated by headline CPI. Prices for 2005–2008 and 2011–2013 are Malaysian Rubber Board daily prices linked to the DOSM basis.</li>
        <li>Weather is modelled (NASA POWER), averaged across 17 points in rubber-growing districts and weighted by each state’s 2023 rubber area. A wet day has at least 5 mm of rain.</li>
        <li>Forest is area by legal status and includes timber plantations in forest reserves. It is not a measure of tree cover.</li>
        <li>Other agriculture is FAO agricultural land minus oil palm and rubber, so treat it as approximate.</li>
        <li>Dashed outlines mark years with no data: planted area and other agriculture for 2024–2025, and forest for 2025. All scales are shared across 2005–2025.</li>
      </ol>
      <p class="meta"><b>Sources:</b> Department of Statistics Malaysia; Ministry of Plantation and Commodities (KPK); Malaysian Rubber Board; Malaysian Palm Oil Board; Ministry of Natural Resources and Environmental Sustainability (NRES); FAOSTAT via World Bank; NASA POWER; Malaysia Biennial Update Reports to the UNFCCC.</p>

  return o;

  icPause.style.display = m === "playing" ? "" : "none";
  icReplay.style.display = m === "ended" ? "" : "none";
  btn.setAttribute("aria-label", m === "playing" ? "Pause" : m === "ended" ? "Replay from 2005" : "Play");
  document.body.classList.toggle("interactive", m !== "playing");
  if (m === "playing") { clearFocus(); hoverMonth = null; pinnedMonth = 0; }
}
const isLive = () => mode !== "playing";
function press() {
  if (mode === "playing") { const target = anim && !anim.finished ? anim.to.year : shown.year; snapTo(target); setMode(shown.year === 2025 ? "ended" : "idle"); return; }
  if (mode === "ended" || shown.year === 2025) {
    setMode("playing"); startTransition(2005, false);
    // hold 2005 before stepping on
    anim.onDoneHold = true; return;
  }
  setMode("playing"); render(shown);
  startTransition(shown.year + 1, true);
}
btn.addEventListener("click", press);
btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(); } });

function chooseYear(y) {
  y = Math.max(2005, Math.min(2025, y));
  if (mode === "playing" || mode === "ended") { setMode("idle"); }
  if (y === shown.year && !anim) return;
  startTransition(y, false);
}
function yearFromEvent(e) {
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(S.getScreenCTM().inverse());
  let best = 2005, bd = Infinity; for (const y of YEARS) { const d = Math.abs(dotX(y) - pt.x); if (d < bd) { bd = d; best = y; } }
  return best;
}
let dragging = false;
for (const t of [track, knob]) t.addEventListener("pointerdown", e => { dragging = true; t.setPointerCapture?.(e.pointerId); chooseYear(yearFromEvent(e)); });
window.addEventListener("pointermove", e => { if (dragging) { const y = yearFromEvent(e); const cur = anim ? anim.to.year : shown.year; if (y !== cur) chooseYear(y); } });
window.addEventListener("pointerup", () => dragging = false);
knob.addEventListener("keydown", e => {
  const cur = anim ? anim.to.year : shown.year;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); chooseYear(cur + 1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); chooseYear(cur - 1); }
  if (e.key === "Home") { e.preventDefault(); chooseYear(2005); }
  if (e.key === "End") { e.preventDefault(); chooseYear(2025); }
});

// hover: highlight the mark and its line in the readout
const groups = {forest: [mForest], rubber: [mLand[0].g], other: [mLand[1].g], palm: [mLand[2].g], small: [mSmall], estate: [mEstate], prod: [mProd], plant: [mPlant]};
const colMembers = {forest: ["forest"], land: ["rubber", "other", "palm"], labour: ["small", "estate"], production: ["prod", "plant"]};
function focusMark(col, key, readoutObj, readKey) {
  colMembers[col].forEach(k => groups[k].forEach(n => n.classList.toggle("dim", k !== key)));
  readoutObj.focus(readKey);
}
function clearFocus() {
  Object.values(groups).flat().forEach(n => n.classList.remove("dim"));
  [tForest, tLand, tAtmo, tLab, tProd].forEach(r => r.focus(null));
  if (hoverMonth !== null) { hoverMonth = null; writeText(shown); }
}
hit({x: F_X0, y: gy(2), width: 181, height: gy(5) - gy(2)}, () => focusMark("forest", "forest", tForest, "forest"));
LAND_ROWS.forEach(r => hit({x: 190.8, y: r.y - G.row, width: 189, height: 2 * G.row}, () => focusMark("land", r.k, tLand, r.k === "rubber" ? "rubber" : r.key)));
for (let i = 0; i < 12; i++) hit({x: MX(i) - MW / 2, y: G.top - 4, width: MW, height: G.h + 8},
  () => { hoverMonth = i; writeText(shown); }, () => { pinnedMonth = i; hoverMonth = i; writeText(shown); });
const hSmall = hit({x: LAB_X, y: G.top, width: 60, height: G.h}, () => focusMark("labour", "small", tLab, "small"));
const hEst = hit({x: 700, y: G.top, width: 40, height: G.h}, () => focusMark("labour", "estate", tLab, "estate"));
const hProd = hit({x: 760, y: 40, width: 189, height: 125}, () => focusMark("production", "prod", tProd, "prod"));
const hPlant = el("circle", {class: "hit", cx: PCX, cy: 125, r: 22}, hits);
hPlant.addEventListener("pointerenter", () => isLive() && focusMark("production", "plant", tProd, "plant"));
hPlant.addEventListener("pointerleave", () => isLive() && focusMark("production", "prod", tProd, "prod"));
// keep labour and planted-area hit areas matched to the drawn marks
const _render = render;
render = function (s) { _render(s);
  hSmall.setAttribute("x", +mSmall.getAttribute("x")); hSmall.setAttribute("width", +mSmall.getAttribute("width"));
  hEst.setAttribute("x", +mEstate.getAttribute("x") - 2); hEst.setAttribute("width", +mEstate.getAttribute("width") + 4);
  hPlant.setAttribute("r", +mPlant.getAttribute("r")); hPlant.setAttribute("cy", +mPlant.getAttribute("cy")); };
// clicking outside the month columns releases a pinned month back to January
document.getElementById("viz").addEventListener("click", e => { if (!e.target.closest || e.target.closest(".hit")) return; if (isLive() && pinnedMonth !== 0) { pinnedMonth = 0; hoverMonth = null; writeText(shown); } });

// replay: after jumping back to 2005, hold, then continue
const _tick = tick;
tick = function (now) {
  if (anim && anim.onDoneHold && !anim.cascade) {
    const st = frameAt(now);
    if (st.done) { shown = anim.to; anim.onDoneHold = false; anim.finished = true; nextAt = now + T.hold; anim.cascade = false; }
    raf = requestAnimationFrame(tick); return;
  }
  _tick(now);
};

// ------------------------------------------------------------------ start
setMode("idle"); render(shown); moveKnob(2005, true);

// ------------------------------------------------------------------ notes panel: hover to peek, click to keep open
(() => {
  const trig = document.getElementById("infoHit"), panel = document.getElementById("notesPanel"), close = document.getElementById("notesClose");
  let pinned = false, hideT = 0;
  const set = on => { panel.classList.toggle("show", on); trig.classList.toggle("open", on); trig.setAttribute("aria-expanded", on); };
  const show = () => { clearTimeout(hideT); set(true); };
  const hideSoon = () => { if (pinned) return; clearTimeout(hideT); hideT = setTimeout(() => set(false), 220); };
  const shut = () => { pinned = false; set(false); };
  trig.addEventListener("pointerenter", show);
  trig.addEventListener("pointerleave", hideSoon);
  panel.addEventListener("pointerenter", show);
  panel.addEventListener("pointerleave", hideSoon);
  trig.addEventListener("click", e => { e.stopPropagation(); pinned = !(pinned && panel.classList.contains("show")); pinned ? show() : shut(); });
  trig.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); trig.click(); } });
  close.addEventListener("click", e => { e.stopPropagation(); shut(); trig.focus(); });
  panel.addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", () => { if (pinned) shut(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && panel.classList.contains("show")) { shut(); trig.focus(); } });
})();
</script>
