<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Counter-Plantation</title>
  <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
  :root {
    /* --- CONFIGURATION PANEL --- */
    --cell-height: 200px;   /* Change this to make rows taller/shorter */
    --font-size: 16px;      /* Change this to make text bigger/smaller */
    --indicator-size: 10px; /* Change this to make the square bigger/smaller */
    --grid-cols: 8;         /* Change this to add/remove columns */
    /* --------------------------- */
  }

  body { margin: 0; overflow: hidden; background: #000; }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    display: block;
  }

  #data-wall-overlay { 
    position: absolute; 
    top: 0; left: 0; 
    width: 100vw; height: 100vh; 
    display: grid;
    grid-template-columns: repeat(var(--grid-cols), 1fr); 
    grid-auto-rows: var(--cell-height);
    z-index: 500;
    pointer-events: none;
  }

  #data-footer {
    position: absolute;
    bottom: 1px; left: 1px; right: 1px;
    height: 50px; /* Shorter, intentional height */
    border: 0.5px solid rgba(136, 255, 0, 0.1);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 40px; /* Space between different data points */
    color: #ffffff;
    font-family: 'Overpass Mono', monospace;
    z-index: 101;
  }

  .footer-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .footer-label { font-size: 8px; opacity: 0.5; text-transform: uppercase; }
  .footer-value { font-size: 13px; font-weight: light; color: #fff; }


  .data-cell {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-family: 'Overpass Mono', monospace;
    font-size: 13px;
    line-height: 1.1;
    text-transform: uppercase;
    padding: 25px;
    border: 0.5px solid rgba(136, 255, 0, 0.1);
    
    /* NEW: Fade-in Logic */
    opacity: 0;
    transition: opacity 1.5s ease-in; 

    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-family: 'Overpass Mono', monospace;
    font-size: 13px;
    line-height: 1.1;
    padding: 25px;
    transition: opacity 1.5s ease;
    
    /* Start hidden */
    opacity: 0;
  }

  .indicator {
    width: var(--indicator-size);
    height: var(--indicator-size);
    background: #88aaff;
    flex-shrink: 0;
    margin-top: 0px;
  }

  .text-stack {
    display: flex;
    flex-direction: column;
    width: 100%;
  }
</style>
</head>
<body>
  <div id="data-wall-overlay"></div>

  <div id="data-footer">
      <div class="footer-item">
          <div class="footer-label">Location</div>
          <div class="footer-value">Perak, Malaysia</div>
      </div>
      <div class="footer-item">
          <div class="footer-label">Status</div>
          <div class="footer-value">Abandoned</div>
      </div>
      <div class="footer-item">
          <div class="footer-label">Habitats</div>
          <div class="footer-value">Agricultural Land, Ex-Mining Land, Plantations, Regenerated Logged-over Forest, Hill Dipterocarp Forest, Heavily Degraded Former Forest, Lowland Dipterocarp Forest, Upper Hill Dipterocarp Forest</div>
      </div>
  </div>

  </body>
<body>

  <div id="data-wall-overlay"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>

  <script src="sketch_ground_v3.js"></script>
  <script src="ground_data_wall.js"></script>

</body>
</html>
